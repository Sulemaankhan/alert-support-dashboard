# ── Server ──────────────────────────────────────────────────────────────────
server.port=8081
spring.application.name=jira-support-alert

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Support Error alert ingestion API

# ── Logging (plain text) ────────────────────────────────────────────────────
logging.file.path=${LOG_PATH:logs}
logging.file.name=${logging.file.path}/jira-support-alert.log
logging.level.root=INFO
logging.level.com.support.alert=DEBUG

# ── HealthCheck APM ─────────────────────────────────────────────────────────
support.healthcheck.enabled=true
support.healthcheck.default-application=drugstore
support.healthcheck.default-environment=local
support.healthcheck.connect-timeout=2s
support.healthcheck.read-timeout=5s
support.healthcheck.apdex-threshold-ms=500
support.healthcheck.max-transactions=12
support.healthcheck.realtime-interval-ms=1000
support.healthcheck.alert-email-enabled=true
support.healthcheck.alert-email-to=emailsupportd13@gmail.com
support.healthcheck.alert-email-cooldown-minutes=15
support.healthcheck.alert-email-poll-interval-ms=15000

# Onboard Drugstore
support.healthcheck.applications.drugstore.name=Drugstore
support.healthcheck.applications.drugstore.environments.local.label=Local
support.healthcheck.applications.drugstore.environments.local.url=http://localhost:8082/actuator
support.healthcheck.applications.drugstore.environments.local.service=drugstore

# Onboard Error Alert (this JVM — collected in-process, not via remote Actuator)
support.healthcheck.applications.error-alert.name=Error Alert
support.healthcheck.applications.error-alert.environments.local.label=Local
support.healthcheck.applications.error-alert.environments.local.url=http://localhost:8081/actuator
support.healthcheck.applications.error-alert.environments.local.service=error-alert

# ── Auth (Google SSO) ───────────────────────────────────────────────────────
# Client ID: --support.auth.google-client-id=... or GOOGLE_CLIENT_ID
support.auth.enabled=true
support.auth.google-sso-only=true
support.auth.google-client-id=${GOOGLE_CLIENT_ID:}
support.auth.session-ttl-hours=12
support.auth.json-alerts-without-sign-in=true

# ── Email inbox defaults (credentials come from the UI) ─────────────────────
support.email.imap.port=993
support.email.imap.folder=INBOX
support.email.imap.max-results=50

# SMTP for APM alert mail / OTP lives in gitignored application-local.properties
# (see application-local.properties.example).

# ── Jira ────────────────────────────────────────────────────────────────────
support.jira.enabled=false
support.jira.site-url=
support.jira.email=
support.jira.api-token=
support.jira.project-key=
support.jira.issue-type=Task
support.jira.set-priority=true