server.port=8081
spring.application.name=jira-support-alert

# Spring Boot Actuator (health probes public; other endpoints require auth when security is on)
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Support Error alert ingestion API

# HealthCheck APM targets. UI selects application + environment; scrape follows that selection.
support.healthcheck.enabled=true
support.healthcheck.default-application=drugstore
support.healthcheck.default-environment=local
support.healthcheck.connect-timeout=2s
support.healthcheck.read-timeout=5s
support.healthcheck.apdex-threshold-ms=500
support.healthcheck.max-transactions=12
# Realtime SSE tick for metrics + alerts (milliseconds)
support.healthcheck.realtime-interval-ms=1000
# Email APM alert metrics when conditions are open (DEGRADED/DOWN, heap, errors, Apdex)
support.healthcheck.alert-email-enabled=true
support.healthcheck.alert-email-to=emailsupportd13@gmail.com
support.healthcheck.alert-email-cooldown-minutes=15
support.healthcheck.alert-email-poll-interval-ms=15000
# Requires spring.mail.host / username / password (Gmail App Password recommended)

# Drugstore API (D:\Java\repo\parmacy\backend)
support.healthcheck.applications.drugstore.name=Drugstore
support.healthcheck.applications.drugstore.environments.local.label=Local
support.healthcheck.applications.drugstore.environments.local.url=http://localhost:8082/actuator/*
support.healthcheck.applications.drugstore.environments.local.service=drugstore
# Point these at the matching Actuator bases (placeholders until those hosts exist).
support.healthcheck.applications.drugstore.environments.dev.label=Dev
support.healthcheck.applications.drugstore.environments.dev.url=http://localhost:8083/actuator
support.healthcheck.applications.drugstore.environments.dev.service=drugstore
support.healthcheck.applications.drugstore.environments.prod.label=Production
support.healthcheck.applications.drugstore.environments.prod.url=http://localhost:8084/actuator
support.healthcheck.applications.drugstore.environments.prod.service=drugstore

# This dashboard (blank URL = scrape this JVM)
support.healthcheck.applications.jira-support-alert.name=Support Error Alert
support.healthcheck.applications.jira-support-alert.environments.local.label=Local
support.healthcheck.applications.jira-support-alert.environments.local.service=jira-support-alert

# Google OAuth client ID (Gmail SSO). Set when starting the service (CLI wins over env):
#   --support.auth.google-client-id=YOUR_ID.apps.googleusercontent.com
# Or set environment variable GOOGLE_CLIENT_ID. See google-oauth.properties.example.
support.auth.google-client-id=${GOOGLE_CLIENT_ID:}

# Logs directory is created under the process working directory (project root when run from IDE).
# Structured JSON logging (ECS) is enabled by default. For plain text in the IDE use: --spring.profiles.active=local
logging.file.path=logs
logging.file.name=logs/jira-support-alert.json
logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.ecs.service.environment=development
logging.level.root=INFO
logging.level.com.support.alert=DEBUG

# Defaults for POST /api/email/inbox (email and password are sent from the UI per search).
support.email.imap.port=993
support.email.imap.folder=INBOX
support.email.imap.max-results=50

# Sign-in: Gmail SSO via Google OAuth. Set enabled=false to disable auth locally.
support.auth.enabled=true
support.auth.session-ttl-hours=12
support.auth.google-sso-only=true
# JSON upload, status, and Jira work without sign-in; Gmail inbox still requires Google SSO.
support.auth.json-alerts-without-sign-in=true
# Jira Cloud: POST /api/alerts/{id}/jira/issue creates an issue (error details → description, severity → priority).
support.jira.enabled=false
support.jira.site-url=
support.jira.email=
support.jira.api-token=
support.jira.project-key=
support.jira.issue-type=Task
support.jira.set-priority=true
