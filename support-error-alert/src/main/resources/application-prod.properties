# Production profile overrides (JSON logging is already enabled in application.properties).
# Activate with: --spring.profiles.active=prod
# Or environment variable: SPRING_PROFILES_ACTIVE=prod

logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${spring.application.version:0.0.1}
logging.structured.ecs.service.environment=production

# Log levels
logging.level.root=INFO
logging.level.com.support.alert=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.apache=WARN

# Prefer a dedicated log directory in production (override via LOG_PATH env var).
logging.file.path=${LOG_PATH:logs}

# Actuator: keep production surface smaller; health probes stay public via SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Rolling policy (also referenced from logback-spring.xml)
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=2GB

# Keep stack traces useful but bounded for log ingestion pipelines
logging.structured.json.stacktrace.max-length=4096
logging.structured.json.stacktrace.max-throwable-depth=30
logging.structured.json.stacktrace.include-hashes=true
